id: positive-trigger-002
name: Fix SPI driver bug
description: Skill should trigger when asked to fix or modify an existing HAL driver.
tags:
  - positive-trigger
inputs:
  prompt: "The SPI driver on RP2040 is returning wrong data, can you debug it?"
expected:
