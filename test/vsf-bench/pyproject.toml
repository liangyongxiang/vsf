[project]
name = "vsf-bench"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "pyserial",
]

[project.scripts]
vsf-board-run = "vsf_bench.board_run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vsf_bench*"]
