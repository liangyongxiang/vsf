rx_fifo_threshold:
  name: usart_rx_fifo_threshold
  suite_timeout_s: 5.0
  dut:
    channel: uart1_rx
    port: /dev/ttyUSB0
  timeout_s: 10.0
  cases:
    - {idx: 0, threshold_mode: 'VSF_USART_RX_FIFO_THRESHOLD_HALF_FULL', expected_bytes: 16}
    - {idx: 1, threshold_mode: 'VSF_USART_RX_FIFO_THRESHOLD_FULL', expected_bytes: 32}
